name: Release artifacts

# Produces the things a release needs and a repository cannot honestly commit by
# hand: a hash-pinned lockfile, a bill of materials for what actually got
# installed, and proof that a clean install works for someone who has never run
# DeckScope before.
#
# Runs on a tag, and on demand so the artifacts can be inspected before tagging
# anything.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  # Build provenance: lets the workflow attest that these artifacts came from
  # this repository at this commit, which is the only claim a downloader can
  # actually verify. Without it "built by CI" is just an assertion in a README.
  id-token: write
  attestations: write

jobs:
  artifacts:
    name: Lockfile, SBOM, and a clean-install acceptance run
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
      - uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38  # v5.4.0
        with:
          python-version: "3.11"

      - name: Build the wheel and sdist
        run: |
          python -m pip install --upgrade pip build
          python -m build --outdir dist/
          ls -la dist/

      # A lockfile is generated, never hand-written: it has to record what the
      # resolver actually chose on a real index, including transitive packages
      # nothing in pyproject.toml names. Hashes make the install verifiable —
      # `--require-hashes` refuses anything that does not match.
      - name: Generate a hash-pinned lockfile
        run: |
          pip install pip-tools
          pip-compile --generate-hashes --all-extras \
            --output-file requirements.lock pyproject.toml
          echo "--- first 20 lines ---"
          head -20 requirements.lock

      # Installed into a clean environment from the lockfile, so the SBOM
      # describes the release rather than the CI runner's accumulated packages.
      - name: Install the release into a clean environment
        run: |
          python -m venv /tmp/release
          /tmp/release/bin/pip install --upgrade pip
          /tmp/release/bin/pip install -r requirements.lock
          /tmp/release/bin/pip install --no-deps "$(ls dist/*.whl)"

      - name: Generate the SBOM from what was actually installed
        run: |
          /tmp/release/bin/python scripts/generate_sbom.py --out sbom.json
          python - <<'PY'
          import json, sys
          bom = json.load(open("sbom.json"))
          assert bom["bomFormat"] == "CycloneDX", "not a CycloneDX document"
          names = {c["name"].lower() for c in bom["components"]}
          # The SBOM is worthless if it missed the things DeckScope imports.
          for required in ("pyyaml", "pdfplumber", "python-pptx", "openpyxl"):
              if required not in names:
                  print(f"SBOM is missing {required}")
                  sys.exit(1)
          print(f"SBOM lists {len(bom['components'])} component(s)")
          PY

      # The acceptance test proper: a person who has just installed DeckScope,
      # in a directory with no source checkout, running the commands the README
      # tells them to run first. Every other job in CI runs from the repository,
      # where this could not fail.
      - name: Clean-install acceptance test
        run: |
          mkdir -p /tmp/newuser && cd /tmp/newuser
          bash "$GITHUB_WORKSPACE/scripts/acceptance.sh" /tmp/release/bin/python

      - name: Attest what was built
        uses: actions/attest-build-provenance@c074443f1aee8d4aeeae555aebba3282517141b2  # v2.2.3
        with:
          subject-path: 'dist/*'

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: release-artifacts
          path: |
            dist/*
            requirements.lock
            sbom.json
          if-no-files-found: error
