name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege. The default token is read/write across the repository, which
# is far more than any job here needs — nothing in CI writes to the repo, so a
# compromised action cannot be handed the ability to.
permissions:
  contents: read


jobs:
  test:
    name: Test · Python ${{ matrix.python }} · ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.9", "3.11", "3.13"]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38  # v5.4.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[all,dev]"

      # No API key is needed: the mock provider drives the whole pipeline,
      # including a panel that disagrees with itself.
      - name: Test
        run: pytest tests/ -q

      - name: Test without pytest
        run: python tests/run_tests.py

      - name: Smoke-test the CLI
        run: |
          python -m deckscope --version
          python -m deckscope providers
          python -m deckscope formats
          python -m deckscope demo --format md json --out ./_demo
          python -m deckscope demo --panel --format md --out ./_panel
          python -m deckscope demo --injected --format md --out ./_injected

      - name: Verify the injection demo actually caught the injection
        shell: bash
        run: |
          grep -q "Input integrity screen" ./_injected/*.md
          grep -q "CRITICAL" ./_injected/*.md

  evaluation:
    name: Evaluation suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38  # v5.4.0
        with:
          python-version: "3.11"
      - run: pip install -e ".[all]"

      # The structural dimensions must hold for any provider, including the mock:
      # a citation to a source that does not exist, an invented figure, or a missed
      # injection is a defect regardless of how good the analysis is.
      #
      # claim_accuracy is NOT gated here, because the mock is a crude fixture and
      # scores badly on it by design. Gating it would only pressure someone into
      # tuning the fixture, which would make the suite prove nothing.
      - name: Structural dimensions must not regress
        run: |
          # The evaluator exits 1 whenever any check fails, and claim_accuracy is
          # expected to fail under the mock. Under `set -e` that ended the step
          # before the gate below ever ran, so this job could not fail for the
          # reason it exists. Exit 2 (misconfigured suite) is still fatal.
          python -m deckscope eval --mode pipeline --save eval.json --out ./_eval \
            || [ $? -eq 1 ]
          python - <<'PY'
          import json, sys
          data = json.load(open("eval.json"))
          dims = data["by_mode"]["pipeline"]["dimensions"]
          required = ["citation_integrity", "no_fabrication", "injection_detection",
                      "calibration"]
          bad = [d for d in required if (dims.get(d) or 0) < 1.0]
          for d in required:
              print(f"  {d}: {dims.get(d)}")
          if bad:
              print(f"REGRESSION in {bad}")
              sys.exit(1)
          print("structural dimensions all at 100%")
          PY

      # The panel is the most expensive mode and went unmeasured for its whole
      # existence, because `--mode` did not accept it. This keeps it measured:
      # it must run, it must be scored on the same dimensions as everything
      # else, and its reported cost must reflect every panelist rather than one.
      - name: The panel must stay evaluable, and honestly costed
        run: |
          python -m deckscope eval --mode pipeline baseline panel \
            --save modes.json --out ./_modes || [ $? -eq 1 ]
          python -m deckscope demo --panel --format json --out ./_panelcost
          python - <<'PY'
          import json, pathlib, sys
          d = json.load(open("modes.json"))
          problems = []
          for mode in ("pipeline", "baseline", "panel"):
              if not d["by_mode"].get(mode, {}).get("cost", {}).get("runs"):
                  problems.append(f"{mode} produced no runs")
              rate = d["by_mode"].get(mode, {}).get("dimensions", {}).get(
                  "claim_accuracy")
              print(f"  {mode:<9} claim_accuracy={rate}")
              if rate is None:
                  problems.append(f"{mode} was not scored on claim_accuracy")

          pipe = d["by_mode"]["pipeline"]["cost"]["input_tokens"]
          panel = d["by_mode"]["panel"]["cost"]["input_tokens"]
          print(f"  panel/pipeline input-token ratio: {panel / max(pipe, 1):.1f}x")
          if panel <= pipe * 2:
              problems.append("panel cost does not account for every panelist")

          # "> 2x a pipeline" was too weak on its own: the reported figure used to
          # be the sum of N independent pipelines, which clears 2x comfortably
          # while excluding review, revision, voting and the chair — the calls
          # that make it a panel at all. So also require the rounds to be counted.
          stats = {}
          for path in pathlib.Path("./_panelcost").glob("*.json"):
              data = json.loads(path.read_text(encoding="utf-8"))
              if "panelists" in (data.get("stats") or {}):
                  stats = data["stats"]
                  break
          usage = stats.get("token_usage") or {}
          rounds = usage.get("panel_rounds") or {}
          independent = usage.get("independent_analyses") or {}
          print(f"  independent analyses: {independent}")
          print(f"  panel rounds:         {rounds}")
          if not rounds.get("calls"):
              problems.append("review/revision/voting/chair calls were not counted")
          if usage.get("input", 0) <= independent.get("input", 0):
              problems.append("the reported total excludes the panel rounds")

          # And the comparison must know whether it could show a difference.
          disc = d.get("discrimination") or {}
          print(f"  comparison informative: {disc.get('comparable')}")
          if "comparable" not in disc:
              problems.append("no discrimination report on a multi-mode run")

          if problems:
              print("FAILED: " + "; ".join(problems))
              sys.exit(1)
          print("the panel is measurable, scored, and honestly costed")
          PY

      # A benchmark whose prompts no longer map to the run is a claim, not
      # evidence — and that is exactly what shipped last time, because the
      # prompts were path-scrubbed after they were hashed. This replays the
      # committed answers through the evaluator offline: no model is called, so
      # it runs here, and a prompt that this build no longer generates is a
      # cache miss that fails rather than a mismatch nobody notices.
      - name: Benchmark artifacts intact (behavioral replay only when prompts match; staleness must be admitted)
        run: python scripts/replay_benchmark.py --all --stale-ok
        # --stale-ok excuses PROMPT DRIFT only while benchmarks/README.md
        # admits it in a STALE notice; artifact corruption still fails.

      - name: The suite must be reproducible
        run: |
          python -m deckscope eval --trials 2 --save stability.json --out ./_eval2 || true
          python - <<'PY'
          import json, sys
          s = json.load(open("stability.json"))["by_mode"]["pipeline"]["stability"]
          print(f"  verdict identical across trials: "
                f"{s['verdict_identical_across_trials']}")
          if s["verdict_identical_across_trials"] != 1.0:
              print("Frozen evidence must give identical results across trials.")
              sys.exit(1)
          PY

  wheel:
    name: Clean-wheel install (the gate must ship with the package)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38  # v5.4.0
        with:
          python-version: "3.11"
      - run: pip install build

      # Everything above this job runs from an editable checkout, where files that
      # are NOT in the wheel are still on disk and importable. That hid a real
      # defect: the evaluation fixtures lived beside the package instead of inside
      # it, so an installed DeckScope loaded zero cases and — because the evaluator
      # reported success when nothing failed — passed by checking nothing.
      #
      # This job installs the built artifact into a clean environment and runs it
      # from a directory that contains no source, so nothing can be picked up off
      # the checkout.
      - name: Build and install the wheel into a clean environment
        run: |
          python -m build --wheel --outdir dist/
          python -m venv /tmp/clean
          /tmp/clean/bin/pip install "$(ls dist/*.whl)"

      - name: The installed evaluator must find its cases and actually run them
        run: |
          mkdir -p /tmp/elsewhere && cd /tmp/elsewhere
          /tmp/clean/bin/python -m deckscope eval --provider mock \
            --save /tmp/wheel-eval.json --out /tmp/_weval || [ $? -eq 1 ]
          python - <<'PY'
          import json, sys
          data = json.load(open("/tmp/wheel-eval.json"))
          ran = len(data["scores"])
          print(f"  cases scored from the installed wheel: {ran}")
          if ran == 0:
              print("The installed package ran no cases. The gate is not in the "
                    "artifact it is supposed to gate.")
              sys.exit(1)
          PY

      - name: A run that checks nothing must fail, not pass
        run: |
          cd /tmp/elsewhere
          for bad in "--trials 0" "--only definitely-not-a-case"; do
            if /tmp/clean/bin/python -m deckscope eval --provider mock $bad \
                 --out /tmp/_wbad; then
              echo "FAIL: 'deckscope eval $bad' exited 0 while checking nothing"
              exit 1
            fi
            echo "  ok: 'deckscope eval $bad' refused to run"
          done

      # The full first-run acceptance run, from a directory with no source. This
      # is what caught `demo --injected` silently falling back to a clean deck
      # once the sample decks were absent from the wheel — a passing security
      # demo that proved nothing.
      - name: Clean-install acceptance test
        run: |
          mkdir -p /tmp/newuser && cd /tmp/newuser
          bash "$GITHUB_WORKSPACE/scripts/acceptance.sh" /tmp/clean/bin/python

      - name: The SBOM generator runs against the installed environment
        run: |
          /tmp/clean/bin/python "$GITHUB_WORKSPACE/scripts/generate_sbom.py" \
            --out /tmp/sbom.json
          python -c "import json;b=json.load(open('/tmp/sbom.json'));assert b['components']"

  minimal:
    name: Core install only (no optional extras)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38  # v5.4.0
        with:
          python-version: "3.11"
      # The core must work with nothing but PyYAML — a missing optional package
      # should remove one capability, never break the run.
      - run: pip install -e .
      - run: python -m deckscope demo --format md json --out ./_demo
      - run: python -m deckscope providers

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38  # v5.4.0
        with:
          python-version: "3.11"
      - run: pip install ruff==0.8.6  # pinned: unpinned CI lint drifts; rules are pinned in pyproject too
      - run: ruff check .
      # Documented claims re-derived from the tree: cost multiples, storage
      # locations, gate language, surface parity. Three audits found this
      # drift class by hand; this makes it a red build instead.
      # `if: always()` because a lint failure earlier in the job must not
      # hide a claims failure — the fifth audit saw exactly that: two ruff
      # findings skipped this step, so the claims verdict for the commit
      # simply did not exist.
      - name: Documented claims must match the code
        if: always()
        run: |
          pip install -e .
          python scripts/check_claims.py

  mcp:
    name: MCP server handshake
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38  # v5.4.0
        with:
          python-version: "3.11"
      - run: pip install -e ".[all]"
      - name: initialize / tools/list / scan
        run: |
          printf '%s\n' \
            '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{}}' \
            '{"jsonrpc":"2.0","id":2,"method":"tools/list"}' \
            '{"jsonrpc":"2.0","id":3,"method":"tools/call","params":{"name":"scan_deck_security","arguments":{"deck_path":"deckscope/examples/sample_deck_with_injection.md"}}}' \
          | python -m deckscope.mcp_server | tee out.jsonl
          grep -q '"analyze_deck_panel"' out.jsonl
          grep -q 'CRITICAL' out.jsonl
