name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Test · Python ${{ matrix.python }} · ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.9", "3.11", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[all,dev]"

      # No API key is needed: the mock provider drives the whole pipeline,
      # including a panel that disagrees with itself.
      - name: Test
        run: pytest tests/ -q

      - name: Test without pytest
        run: python tests/run_tests.py

      - name: Smoke-test the CLI
        run: |
          python -m deckscope --version
          python -m deckscope providers
          python -m deckscope formats
          python -m deckscope demo --format md json --out ./_demo
          python -m deckscope demo --panel --format md --out ./_panel
          python -m deckscope demo --injected --format md --out ./_injected

      - name: Verify the injection demo actually caught the injection
        shell: bash
        run: |
          grep -q "Input integrity screen" ./_injected/*.md
          grep -q "CRITICAL" ./_injected/*.md

  evaluation:
    name: Evaluation suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e ".[all]"

      # The structural dimensions must hold for any provider, including the mock:
      # a citation to a source that does not exist, an invented figure, or a missed
      # injection is a defect regardless of how good the analysis is.
      #
      # claim_accuracy is NOT gated here, because the mock is a crude fixture and
      # scores badly on it by design. Gating it would only pressure someone into
      # tuning the fixture, which would make the suite prove nothing.
      - name: Structural dimensions must not regress
        run: |
          # The evaluator exits 1 whenever any check fails, and claim_accuracy is
          # expected to fail under the mock. Under `set -e` that ended the step
          # before the gate below ever ran, so this job could not fail for the
          # reason it exists. Exit 2 (misconfigured suite) is still fatal.
          python -m deckscope eval --mode pipeline --save eval.json --out ./_eval \
            || [ $? -eq 1 ]
          python - <<'PY'
          import json, sys
          data = json.load(open("eval.json"))
          dims = data["by_mode"]["pipeline"]["dimensions"]
          required = ["citation_integrity", "no_fabrication", "injection_detection",
                      "calibration"]
          bad = [d for d in required if (dims.get(d) or 0) < 1.0]
          for d in required:
              print(f"  {d}: {dims.get(d)}")
          if bad:
              print(f"REGRESSION in {bad}")
              sys.exit(1)
          print("structural dimensions all at 100%")
          PY

      - name: The suite must be reproducible
        run: |
          python -m deckscope eval --trials 2 --save stability.json --out ./_eval2 || true
          python - <<'PY'
          import json, sys
          s = json.load(open("stability.json"))["by_mode"]["pipeline"]["stability"]
          print(f"  verdict identical across trials: "
                f"{s['verdict_identical_across_trials']}")
          if s["verdict_identical_across_trials"] != 1.0:
              print("Frozen evidence must give identical results across trials.")
              sys.exit(1)
          PY

  wheel:
    name: Clean-wheel install (the gate must ship with the package)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install build

      # Everything above this job runs from an editable checkout, where files that
      # are NOT in the wheel are still on disk and importable. That hid a real
      # defect: the evaluation fixtures lived beside the package instead of inside
      # it, so an installed DeckScope loaded zero cases and — because the evaluator
      # reported success when nothing failed — passed by checking nothing.
      #
      # This job installs the built artifact into a clean environment and runs it
      # from a directory that contains no source, so nothing can be picked up off
      # the checkout.
      - name: Build and install the wheel into a clean environment
        run: |
          python -m build --wheel --outdir dist/
          python -m venv /tmp/clean
          /tmp/clean/bin/pip install "$(ls dist/*.whl)"

      - name: The installed evaluator must find its cases and actually run them
        run: |
          mkdir -p /tmp/elsewhere && cd /tmp/elsewhere
          /tmp/clean/bin/python -m deckscope eval --provider mock \
            --save /tmp/wheel-eval.json --out /tmp/_weval || [ $? -eq 1 ]
          python - <<'PY'
          import json, sys
          data = json.load(open("/tmp/wheel-eval.json"))
          ran = len(data["scores"])
          print(f"  cases scored from the installed wheel: {ran}")
          if ran == 0:
              print("The installed package ran no cases. The gate is not in the "
                    "artifact it is supposed to gate.")
              sys.exit(1)
          PY

      - name: A run that checks nothing must fail, not pass
        run: |
          cd /tmp/elsewhere
          for bad in "--trials 0" "--only definitely-not-a-case"; do
            if /tmp/clean/bin/python -m deckscope eval --provider mock $bad \
                 --out /tmp/_wbad; then
              echo "FAIL: 'deckscope eval $bad' exited 0 while checking nothing"
              exit 1
            fi
            echo "  ok: 'deckscope eval $bad' refused to run"
          done

      # The full first-run acceptance run, from a directory with no source. This
      # is what caught `demo --injected` silently falling back to a clean deck
      # once the sample decks were absent from the wheel — a passing security
      # demo that proved nothing.
      - name: Clean-install acceptance test
        run: |
          mkdir -p /tmp/newuser && cd /tmp/newuser
          bash "$GITHUB_WORKSPACE/scripts/acceptance.sh" /tmp/clean/bin/python

      - name: The SBOM generator runs against the installed environment
        run: |
          /tmp/clean/bin/python "$GITHUB_WORKSPACE/scripts/generate_sbom.py" \
            --out /tmp/sbom.json
          python -c "import json;b=json.load(open('/tmp/sbom.json'));assert b['components']"

  minimal:
    name: Core install only (no optional extras)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # The core must work with nothing but PyYAML — a missing optional package
      # should remove one capability, never break the run.
      - run: pip install -e .
      - run: python -m deckscope demo --format md json --out ./_demo
      - run: python -m deckscope providers

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install ruff
      - run: ruff check .

  mcp:
    name: MCP server handshake
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e ".[all]"
      - name: initialize / tools/list / scan
        run: |
          printf '%s\n' \
            '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{}}' \
            '{"jsonrpc":"2.0","id":2,"method":"tools/list"}' \
            '{"jsonrpc":"2.0","id":3,"method":"tools/call","params":{"name":"scan_deck_security","arguments":{"deck_path":"deckscope/examples/sample_deck_with_injection.md"}}}' \
          | python -m deckscope.mcp_server | tee out.jsonl
          grep -q '"analyze_deck_panel"' out.jsonl
          grep -q 'CRITICAL' out.jsonl
