[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "deckscope"
version = "0.0.0.dev0"   # unreleased; see README
description = "An agentic framework that analyzes a pitch deck, researches its market, and compares the two."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "CinvanaAI" }]
keywords = ["pitch deck", "venture capital", "market research", "agents", "llm",
            "due diligence", "prompt injection", "mcp"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Financial and Insurance Industry",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Office/Business :: Financial :: Investment",
  "Topic :: Text Processing :: Markup",
]

# Deliberately tiny. Every provider and every output format is optional; the core
# runs on the standard library plus PyYAML.
dependencies = ["PyYAML>=5.4"]

[project.optional-dependencies]
docs   = ["pdfplumber>=0.10", "python-pptx>=0.6.21", "python-docx>=1.0"]
office = ["openpyxl>=3.1", "reportlab>=3.6"]
sdk    = ["anthropic>=0.40"]
aws    = ["boto3>=1.34"]
# Everything a normal desktop install wants:
all    = ["pdfplumber>=0.10", "python-pptx>=0.6.21", "python-docx>=1.0",
          "openpyxl>=3.1", "reportlab>=3.6"]
dev    = ["pytest>=7", "ruff>=0.4"]

[project.scripts]
deckscope = "deckscope.cli:main"

[project.urls]
Homepage = "https://github.com/CinvanaAI/DeckScope"
Documentation = "https://github.com/CinvanaAI/DeckScope/tree/main/docs"
Issues = "https://github.com/CinvanaAI/DeckScope/issues"

[tool.setuptools.packages.find]
include = ["deckscope*"]

[tool.setuptools.package-data]
deckscope = [
    "py.typed",
    # The evaluation fixtures are shipped with the package on purpose. They are
    # the release gate, and a gate that is absent from the artifact it gates
    # passes vacuously. See deckscope/evaluation/cases.py:default_suite_dir.
    "evaluation/suite/cases/*.json",
    "evaluation/suite/corpora/*.json",
    "evaluation/suite/decks/*.md",
    # `deckscope demo` is the first command the README gives a new user, and
    # `--injected` is how the security screen is demonstrated. Both read these,
    # so they are runtime data rather than documentation.
    "examples/*.md",
]

[tool.ruff]
line-length = 92
target-version = "py39"

[tool.ruff.lint]
# Ruff's own defaults, pinned so a future ruff release can't fail CI by adding rules.
select = ["E4", "E7", "E9", "F"]

[tool.ruff.lint.per-file-ignores]
# Package __init__ files exist to re-export. Their imports are the public API,
# so "unused import" is exactly wrong there.
"__init__.py" = ["F401"]
# The examples import DeckScope to demonstrate registration side effects.
"examples/*" = ["F401"]
